version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so bump them together.
      codeql-action:
        patterns:
          - github/codeql-action*
  - package-ecosystem: pip
    directory: /security
    schedule:
      interval: weekly
