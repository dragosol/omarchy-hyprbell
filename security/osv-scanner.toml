# Advisories in packages that semgrep pins exactly (semgrep 1.185.0 requires
# mcp==1.29.0 and opentelemetry-api~=1.37.0), so the lock cannot move past
# them yet. These are development-only scanner dependencies, never loaded by
# the plugin. CI only runs `semgrep scan --metrics=off`, which starts no MCP
# server or client and parses no incoming trace headers. Each ignore expires
# so the next look is forced; drop them once semgrep relaxes its pins.

